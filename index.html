<!DOCTYPE html>
<html>
<head>
  <title>Keerthana AI Resume</title>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .chat-container {
      width: 400px;
      height: 600px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #111827;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .user {
      text-align: right;
      color: #2563eb;
      font-weight: 500;
    }

    .bot {
      text-align: left;
      color: #111827;
    }

    .input-area {
      border-top: 1px solid #eee;
    }

    .input-area form {
      display: flex;
      width: 100%;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    button {
      padding: 12px 20px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: 500;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <div class="header">
      🤖 Ask Keerthana's AI Resume
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <form id="chatForm">
        <input 
          type="text" 
          id="userInput" 
          placeholder="Ask about experience..." 
          autocomplete="off"
        />
        <button type="submit" id="sendBtn">Send</button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("userInput");
    const messages = document.getElementById("messages");
    const sendBtn = document.getElementById("sendBtn");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const userText = input.value.trim();
      if (!userText) return;

      // Show user message
      messages.innerHTML += `<div class="message user">${userText}</div>`;
      input.value = "";
      sendBtn.disabled = true;

      // Show loading indicator
      const loadingId = Date.now();
      messages.innerHTML += `<div class="message bot" id="loading-${loadingId}">Typing...</div>`;
      messages.scrollTop = messages.scrollHeight;

      try {
        const response = await fetch("https://keerthana-ai-backend-1.onrender.com/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: userText })
        });

        const data = await response.json();

        // Remove loading message
        document.getElementById(`loading-${loadingId}`).remove();

        // Show bot response
        messages.innerHTML += `<div class="message bot">${data.response}</div>`;
        messages.scrollTop = messages.scrollHeight;

      } catch (error) {
        document.getElementById(`loading-${loadingId}`).remove();
        messages.innerHTML += `<div class="message bot">⚠️ Connection error. Please try again.</div>`;
      }

      sendBtn.disabled = false;
    });
  </script>
</body>
</html>
