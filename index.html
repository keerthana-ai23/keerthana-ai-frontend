<!DOCTYPE html>
<html>
<head>
  <title>Keerthana AI Assistant</title>
  <meta charset="UTF-8" />

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #fff0f6;
    }

    /* Toggle Button */
    .chat-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #f783ac, #d63384);
      color: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(214,51,132,0.4);
      z-index: 1000;
      transition: 0.3s ease;
    }

    .chat-toggle:hover {
      transform: scale(1.1);
    }

    /* Chat Container */
    .chat-container {
      position: fixed;
      bottom: 100px;
      right: 20px;
      width: 380px;
      height: 540px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(214,51,132,0.25);
      display: none;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.3s ease forwards;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      background: linear-gradient(135deg, #f783ac, #d63384);
      color: white;
      padding: 16px;
      font-weight: 600;
      text-align: center;
      position: relative;
    }

    .close-btn {
      position: absolute;
      right: 15px;
      top: 12px;
      cursor: pointer;
      font-size: 16px;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fff9fb;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .user {
      align-self: flex-end;
      background: #ffe3ec;
      color: #c2255c;
    }

    .bot {
      align-self: flex-start;
      background: #f8d7e3;
      color: #862e9c;
    }

    .bot-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    .typing {
      display: flex;
      gap: 4px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: #862e9c;
      border-radius: 50%;
      animation: blink 1.4s infinite both;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0% { opacity: 0.2; }
      20% { opacity: 1; }
      100% { opacity: 0.2; }
    }

    .input-area form {
      display: flex;
      border-top: 1px solid #f1c2d4;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
    }

    button {
      padding: 12px 16px;
      border: none;
      background: #d63384;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #c2255c;
    }
  </style>
</head>

<body>

  <!-- Toggle Button -->
 <div class="chat-toggle" onclick="openChat()">
  <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" width="28" />
</div>


  <!-- Chat Window -->
  <div class="chat-container" id="chatBox">
    <div class="header">
      Keerthana AI Assistant
      <span class="close-btn" onclick="closeChat()">✕</span>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <form id="chatForm">
        <input type="text" id="userInput" placeholder="Ask about experience..." autocomplete="off"/>
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const messages = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("userInput");

    let firstOpen = true;

    function openChat() {
      chatBox.style.display = "flex";

      if (firstOpen) {
        addBotMessage("Hello 👋 I'm Keerthana's AI assistant. How can I assist you today?");
        firstOpen = false;
      }
    }

    function closeChat() {
      chatBox.style.display = "none";
    }

    function addBotMessage(text) {
      messages.innerHTML += `
        <div class="message bot">
          <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" class="bot-avatar"/>
          <div>${text}</div>
        </div>
      `;
      messages.scrollTop = messages.scrollHeight;
    }

    function showTyping() {
      messages.innerHTML += `
        <div class="message bot" id="typing">
          <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" class="bot-avatar"/>
          <div class="typing"><span></span><span></span><span></span></div>
        </div>
      `;
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const userText = input.value.trim();
      if (!userText) return;

      messages.innerHTML += `<div class="message user">${userText}</div>`;
      input.value = "";
      messages.scrollTop = messages.scrollHeight;

      showTyping();

      try {
        const response = await fetch("https://keerthana-ai-backend-1.onrender.com/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: userText })
        });

        const data = await response.json();

        document.getElementById("typing").remove();
        addBotMessage(data.response);

      } catch (error) {
        document.getElementById("typing").remove();
        addBotMessage("⚠️ Connection issue. Please try again.");
      }
    });
  </script>

</body>
</html>
