<!DOCTYPE html>
<html>
<head>
  <title>Keerthana AI Assistant</title>
  <meta charset="UTF-8" />

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #fff5f9;
    }

    /* Chat Toggle Button */
    .chat-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      background: #ff69b4;
      color: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(255,105,180,0.4);
      z-index: 1000;
      transition: transform 0.2s ease;
    }

    .chat-toggle:hover {
      transform: scale(1.1);
    }

    /* Chat Window */
    .chat-container {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 350px;
      height: 500px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(255,105,180,0.3);
      display: none;
      flex-direction: column;
      overflow: hidden;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      background: #ff69b4;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      position: relative;
    }

    .close-btn {
      position: absolute;
      right: 15px;
      top: 10px;
      cursor: pointer;
      font-size: 18px;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      font-size: 14px;
    }

    .message {
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .user {
      text-align: right;
      color: #d63384;
      font-weight: 500;
    }

    .bot {
      text-align: left;
      color: #333;
    }

    .input-area form {
      display: flex;
      border-top: 1px solid #eee;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
    }

    button {
      padding: 12px 16px;
      border: none;
      background: #ff69b4;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #e754a3;
    }
  </style>
</head>

<body>

  <!-- Chat Toggle Button -->
  <div class="chat-toggle" onclick="openChat()">💖</div>

  <!-- Chat Container -->
  <div class="chat-container" id="chatBox">
    <div class="header">
      Keerthana AI Assistant
      <span class="close-btn" onclick="closeChat()">✖</span>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <form id="chatForm">
        <input 
          type="text" 
          id="userInput" 
          placeholder="Ask me anything..." 
          autocomplete="off"
        />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const messages = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("userInput");

    let firstOpen = true;

    function openChat() {
      chatBox.style.display = "flex";

      if (firstOpen) {
        messages.innerHTML += `
          <div class="message bot">
            Hello 👋 I'm Keerthana's AI assistant. How can I help you today?
          </div>
        `;
        firstOpen = false;
      }
    }

    function closeChat() {
      chatBox.style.display = "none";
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const userText = input.value.trim();
      if (!userText) return;

      messages.innerHTML += `<div class="message user">${userText}</div>`;
      input.value = "";
      messages.scrollTop = messages.scrollHeight;

      try {
        const response = await fetch("https://keerthana-ai-backend-1.onrender.com/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: userText })
        });

        const data = await response.json();

        messages.innerHTML += `<div class="message bot">${data.response}</div>`;
        messages.scrollTop = messages.scrollHeight;

      } catch (error) {
        messages.innerHTML += `<div class="message bot">⚠️ Connection error.</div>`;
      }
    });
  </script>

</body>
</html>
