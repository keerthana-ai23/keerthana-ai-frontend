<!DOCTYPE html>
<html>
<head>
  <title>Keerthana AI Assistant</title>
  <meta charset="UTF-8" />

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #fff0f6;
    }

    /* Chat Toggle Button */
    .chat-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      background: #f783ac;
      color: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(247,131,172,0.4);
      z-index: 1000;
      transition: all 0.2s ease;
    }

    .chat-toggle:hover {
      transform: scale(1.08);
      background: #e64980;
    }

    /* Chat Window */
    .chat-container {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 360px;
      height: 520px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(247,131,172,0.25);
      display: none;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      background: #f783ac;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: 600;
      position: relative;
      letter-spacing: 0.5px;
    }

    .close-btn {
      position: absolute;
      right: 15px;
      top: 12px;
      cursor: pointer;
      font-size: 16px;
      opacity: 0.8;
    }

    .close-btn:hover {
      opacity: 1;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      font-size: 14px;
      background: #fff9fb;
    }

    .message {
      margin-bottom: 12px;
      line-height: 1.5;
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      display: inline-block;
    }

    .user {
      background: #ffe3ec;
      color: #c2255c;
      align-self: flex-end;
      margin-left: auto;
    }

    .bot {
      background: #f8d7e3;
      color: #862e9c;
      align-self: flex-start;
    }

    .input-area form {
      display: flex;
      border-top: 1px solid #f1c2d4;
      background: white;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    button {
      padding: 12px 16px;
      border: none;
      background: #f783ac;
      color: white;
      cursor: pointer;
      font-weight: 500;
    }

    button:hover {
      background: #e64980;
    }
  </style>
</head>

<body>

  <!-- Toggle Button -->
  <div class="chat-toggle" onclick="openChat()">Chat</div>

  <!-- Chat Window -->
  <div class="chat-container" id="chatBox">
    <div class="header">
      Keerthana AI Assistant
      <span class="close-btn" onclick="closeChat()">✕</span>
    </div>

    <div class="messages" id="messages" style="display:flex; flex-direction:column;"></div>

    <div class="input-area">
      <form id="chatForm">
        <input 
          type="text" 
          id="userInput" 
          placeholder="Ask about experience..." 
          autocomplete="off"
        />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const messages = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("userInput");

    let firstOpen = true;

    function openChat() {
      chatBox.style.display = "flex";

      if (firstOpen) {
        messages.innerHTML += `
          <div class="message bot">
            Hello 👋 I'm Keerthana's AI assistant. How can I assist you today?
          </div>
        `;
        firstOpen = false;
      }
    }

    function closeChat() {
      chatBox.style.display = "none";
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const userText = input.value.trim();
      if (!userText) return;

      messages.innerHTML += `<div class="message user">${userText}</div>`;
      input.value = "";
      messages.scrollTop = messages.scrollHeight;

      try {
        const response = await fetch("https://keerthana-ai-backend-1.onrender.com/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: userText })
        });

        const data = await response.json();

        messages.innerHTML += `<div class="message bot">${data.response}</div>`;
        messages.scrollTop = messages.scrollHeight;

      } catch (error) {
        messages.innerHTML += `<div class="message bot">⚠️ Connection issue. Please try again.</div>`;
      }
    });
  </script>

</body>
</html>
