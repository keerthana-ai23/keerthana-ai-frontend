<!DOCTYPE html>
<html>
<head>
  <title>Keerthana AI Resume</title>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .chat-container {
      width: 400px;
      height: 600px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #111827;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 12px;
    }

    .user {
      text-align: right;
      color: #2563eb;
    }

    .bot {
      text-align: left;
      color: #111827;
    }

    .input-area {
      display: flex;
      border-top: 1px solid #eee;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
    }

    button {
      padding: 12px 20px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <div class="header">
      🤖 Ask Keerthana's AI Resume
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <form onsubmit="sendMessage(); return false;">
    <input type="text" id="userInput" placeholder="Ask about experience..." />
    <button type="submit">Send</button>
</form>

    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const messages = document.getElementById("messages");

      const userText = input.value.trim();
      if (!userText) return;

      messages.innerHTML += `<div class="message user">${userText}</div>`;
      input.value = "";

      const response = await fetch("https://keerthana-ai-backend-1.onrender.com/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: userText })
      });

      const data = await response.json();

      messages.innerHTML += `<div class="message bot">${data.response}</div>`;
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
