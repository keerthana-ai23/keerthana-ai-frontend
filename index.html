<!DOCTYPE html>
<html>
<head>
  <title>Keerthana AI Resume</title>
  <meta charset="UTF-8" />

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
    }

    /* Chat Bubble Button */
    .chat-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      background: #2563eb;
      color: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    /* Chat Window */
    .chat-container {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 350px;
      height: 500px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #111827;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      font-size: 14px;
    }

    .message {
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .user {
      text-align: right;
      color: #2563eb;
      font-weight: 500;
    }

    .bot {
      text-align: left;
      color: #111827;
    }

    .input-area form {
      display: flex;
      border-top: 1px solid #eee;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
    }

    button {
      padding: 12px 16px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <!-- Chat Toggle Button -->
  <div class="chat-toggle" onclick="toggleChat()">💬</div>

  <!-- Chat Container -->
  <div class="chat-container" id="chatBox">
    <div class="header">🤖 Keerthana AI Assistant</div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <form id="chatForm">
        <input 
          type="text" 
          id="userInput" 
          placeholder="Ask me anything..." 
          autocomplete="off"
        />
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const messages = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("userInput");

    let firstOpen = true;

    function toggleChat() {
      if (chatBox.style.display === "flex") {
        chatBox.style.display = "none";
      } else {
        chatBox.style.display = "flex";

        if (firstOpen) {
          messages.innerHTML += `
            <div class="message bot">
              Hello 👋 How can I assist you today?
            </div>
          `;
          firstOpen = false;
        }
      }
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const userText = input.value.trim();
      if (!userText) return;

      messages.innerHTML += `<div class="message user">${userText}</div>`;
      input.value = "";
      messages.scrollTop = messages.scrollHeight;

      try {
        const response = await fetch("https://keerthana-ai-backend-1.onrender.com/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: userText })
        });

        const data = await response.json();

        messages.innerHTML += `<div class="message bot">${data.response}</div>`;
        messages.scrollTop = messages.scrollHeight;

      } catch (error) {
        messages.innerHTML += `<div class="message bot">⚠️ Connection error.</div>`;
      }
    });
  </script>

</body>
</html>
