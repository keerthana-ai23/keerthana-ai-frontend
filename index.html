<!-- CHATBOT -->
<div class="chat-toggle" onclick="openChat()">
  <img src="https://cdn-icons-png.flaticon.com/512/4712/4712027.png" />
</div>

<div class="chat-container" id="chatBox">
  <div class="chat-header">
    <div class="chat-title">
      <img src="https://cdn-icons-png.flaticon.com/512/4712/4712027.png" />
      <span>Keerthana AI</span>
    </div>
    <span onclick="closeChat()" style="cursor:pointer;">✕</span>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <form id="chatForm">
      <input type="text" id="userInput" placeholder="Ask me anything..." />
      <button type="submit">Send</button>
    </form>
  </div>
</div>


<script>
const chatBox = document.getElementById("chatBox");
const messages = document.getElementById("messages");
const form = document.getElementById("chatForm");
const input = document.getElementById("userInput");

function openChat() {
  chatBox.style.display = "flex";

  if (messages.innerHTML === "") {
    addBotMessage("Hey 👋 How are you? Ask me about my experience!");
  }
}

function closeChat() {
  chatBox.style.display = "none";
}

function addBotMessage(text) {
  messages.innerHTML += `
    <div class="message-row">
      <img class="bot-avatar" src="https://cdn-icons-png.flaticon.com/512/4712/4712027.png">
      <div class="bot-bubble">${text}</div>
    </div>
  `;
}

function addUserMessage(text) {
  messages.innerHTML += `
    <div class="message-row user-row">
      <div class="user-bubble">${text}</div>
    </div>
  `;
}

form.addEventListener("submit", async function(e) {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  addUserMessage(text);
  input.value = "";

  try {
    const response = await fetch("https://keerthana-ai-backend-1.onrender.com/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    const data = await response.json();
    addBotMessage(data.response);
  } catch {
    addBotMessage("⚠️ Something went wrong. Please try again.");
  }

  messages.scrollTop = messages.scrollHeight;
});

</script>
